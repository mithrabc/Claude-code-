<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Claude Remote</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕹️%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="bar">
      <div class="title">
        <span class="dot" id="conn-dot"></span>
        <strong>Claude Remote</strong>
      </div>
      <div class="meta" id="meta">connecting…</div>
      <button id="menu-btn" class="icon-btn" title="Session actions" aria-label="Session actions">⋯</button>
      <div id="menu" class="menu hidden">
        <button data-action="autopilot">Autopilot…</button>
        <button data-action="workspace">Switch workspace…</button>
        <button data-action="reset">New conversation</button>
        <button data-action="stop">Stop current turn</button>
      </div>
    </header>

    <main id="transcript" aria-live="polite"></main>

    <div id="ws-overlay" class="overlay hidden">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ws-title">
        <h2 id="ws-title">Workspace</h2>
        <p class="sheet-sub">Switching starts a fresh conversation in the chosen directory.</p>
        <ul id="ws-list"></ul>
        <div id="ws-custom" class="hidden">
          <label for="ws-input">Open another path</label>
          <div class="row">
            <input id="ws-input" type="text" placeholder="/absolute/path/to/project" autocomplete="off" spellcheck="false" />
            <button id="ws-open" type="button">Open</button>
          </div>
        </div>
        <button id="ws-close" class="sheet-close" type="button">Close</button>
      </div>
    </div>

    <div id="ap-overlay" class="overlay hidden">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ap-title">
        <h2 id="ap-title">🤖 Autopilot</h2>
        <p class="sheet-sub">
          Give Claude a goal and pocket your phone: it keeps working turn after
          turn — unattended — until it declares the goal done or hits the turn limit.
        </p>
        <label class="field-label" for="ap-goal">Goal</label>
        <textarea
          id="ap-goal"
          rows="3"
          placeholder="e.g. Make the test suite pass, then update the changelog"
          autocomplete="off"
        ></textarea>
        <label class="field-label" for="ap-turns">Turn limit: <strong id="ap-turns-val">8</strong></label>
        <input id="ap-turns" type="range" min="1" max="25" value="8" />
        <button id="ap-start" type="button">Engage autopilot</button>
        <button id="ap-close" class="sheet-close" type="button">Close</button>
      </div>
    </div>

    <div id="ap-bar" class="hidden">
      <span id="ap-status">🤖 Autopilot engaged</span>
      <button id="ap-stop" type="button">Stop</button>
    </div>

    <form id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Message Claude Code…  (Enter to send, Shift+Enter for newline)"
        autocomplete="off"
        autocapitalize="sentences"
      ></textarea>
      <button id="send" type="submit" aria-label="Send">➤</button>
    </form>

    <script src="/app.js" type="module"></script>
  </body>
</html>
